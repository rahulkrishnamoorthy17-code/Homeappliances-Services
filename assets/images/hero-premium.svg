<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06111f"/><stop offset="1" stop-color="#17345a"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#e8edf3"/><stop offset=".45" stop-color="#fdfefe"/><stop offset="1" stop-color="#b7c0ca"/></linearGradient>
 <linearGradient id="darkmetal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1018"/><stop offset=".45" stop-color="#232b36"/><stop offset="1" stop-color="#05070b"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55a7ff"/><stop offset="1" stop-color="#1766e6"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="25" flood-color="#000" flood-opacity=".35"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
</defs>
<rect width="100%" height="100%" fill="url(#bg)"/>
<circle cx="1000" cy="130" r="220" fill="#3d7dff" opacity=".14" filter="url(#soft)"/>
<circle cx="200" cy="780" r="260" fill="#70cfff" opacity=".10" filter="url(#soft)"/>

<rect x="0" y="610" width="1200" height="290" fill="#07101b" opacity=".62"/>
<rect x="40" y="150" width="1120" height="520" rx="36" fill="#101e31" opacity=".72" stroke="#ffffff" stroke-opacity=".08"/>
<!-- cabinetry -->
<g opacity=".78"><rect x="80" y="190" width="220" height="160" rx="16" fill="#26384d"/><rect x="315" y="190" width="220" height="160" rx="16" fill="#26384d"/><rect x="550" y="190" width="220" height="160" rx="16" fill="#26384d"/><rect x="785" y="190" width="310" height="160" rx="16" fill="#26384d"/></g>
<rect x="75" y="365" width="1040" height="26" rx="13" fill="#c8d8ea" opacity=".9"/>
<!-- fridge --> <g filter="url(#shadow)" transform="translate(785,262)"><rect width="245" height="420" rx="28" fill="url(#darkmetal)"/><line x1="122" y1="15" x2="122" y2="405" stroke="#596573" stroke-width="2"/><rect x="25" y="66" width="76" height="92" rx="10" fill="#0b1520" stroke="#438fe7"/><circle cx="63" cy="100" r="11" fill="#2d83ee"/><rect x="151" y="67" width="7" height="122" rx="4" fill="#aeb8c3"/><rect x="87" y="67" width="7" height="122" rx="4" fill="#aeb8c3"/></g>
<!-- washer --> <g filter="url(#shadow)" transform="translate(430,424)"><rect width="230" height="255" rx="25" fill="url(#metal)"/><rect x="24" y="22" width="182" height="34" rx="10" fill="#ccd4dd"/><circle cx="115" cy="150" r="73" fill="#171e29"/><circle cx="115" cy="150" r="56" fill="#344457"/><path d="M69 159c40-32 80-25 95 13-31 28-71 32-95-13Z" fill="#7bc8ff" opacity=".55"/></g>
<!-- oven/microwave --> <g filter="url(#shadow)" transform="translate(175,448)"><rect width="195" height="135" rx="18" fill="url(#darkmetal)"/><rect x="17" y="20" width="130" height="94" rx="12" fill="#0d1622" stroke="#54677c"/><rect x="158" y="25" width="18" height="72" rx="8" fill="#26364a"/><circle cx="167" cy="42" r="6" fill="#55a7ff"/></g>
<!-- ac --> <g filter="url(#shadow)" transform="translate(120,255)"><rect width="385" height="92" rx="28" fill="url(#metal)"/><rect x="48" y="63" width="287" height="7" rx="3" fill="#90a0b2"/><circle cx="350" cy="30" r="7" fill="#43c77a"/></g>
<rect x="55" y="70" width="690" height="5" rx="2" fill="url(#blue)" opacity=".85"/>
</svg>